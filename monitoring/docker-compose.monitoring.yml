version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: shawty-postgres
    environment:
      POSTGRES_USER: howl
      POSTGRES_PASSWORD: turnip_man1234
      POSTGRES_DB: social
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - shawty-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: shawty-redis
    command: redis-server --requirepass waifu_waguri
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - shawty-network

  # Your existing app with network
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shawty-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - shawty-network

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: shawty-prometheus
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - shawty-network

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: shawty-grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - shawty-network

  # PostgreSQL Exporter - Database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: shawty-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://howl:turnip_man1234@postgres:5432/social?sslmode=disable"
    ports:
      - "9187:9187"
    restart: unless-stopped
    networks:
      - shawty-network

  # Redis Exporter - Cache metrics
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: shawty-redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "waifu_waguri"
    ports:
      - "9121:9121"
    restart: unless-stopped
    networks:
      - shawty-network

networks:
  shawty-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data: